<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalendarz — Święta, Wydarzenia i Zadania</title>
  <meta name="description" content="Nowoczesny kalendarz z polskimi świętami państwowymi, wydarzeniami i zadaniami." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- decorative background -->
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb--1"></span>
    <span class="orb orb--2"></span>
    <span class="orb orb--3"></span>
  </div>

  <div class="app">
    <!-- HEADER -->
    <header class="topbar">
      <div class="brand">
        <div class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="4.5" width="18" height="16" rx="3.5"/>
            <path d="M3 9h18M8 2.5v4M16 2.5v4"/>
            <circle cx="8.5" cy="13.5" r="1.1" fill="currentColor" stroke="none"/>
            <circle cx="12" cy="13.5" r="1.1" fill="currentColor" stroke="none"/>
            <circle cx="15.5" cy="13.5" r="1.1" fill="currentColor" stroke="none"/>
          </svg>
        </div>
        <div class="brand__text">
          <span class="brand__name">Kalendarz</span>
          <span class="brand__sub" id="clock">—</span>
        </div>
      </div>

      <button class="theme-toggle" id="themeToggle" aria-label="Zmień motyw" title="Zmień motyw">
        <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.5M12 19v2.5M4.5 4.5l1.8 1.8M17.7 17.7l1.8 1.8M2.5 12H5M19 12h2.5M4.5 19.5l1.8-1.8M17.7 6.3l1.8-1.8"/></svg>
        <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </header>

    <!-- REMINDER -->
    <div class="reminder" id="reminder" role="status" aria-live="polite">
      <div class="reminder__pulse" aria-hidden="true"><span></span></div>
      <div class="reminder__body">
        <span class="reminder__label">Najbliższe wydarzenie</span>
        <span class="reminder__text" id="reminderText">Brak nadchodzących wydarzeń</span>
      </div>
      <span class="reminder__countdown" id="reminderCountdown"></span>
    </div>

    <!-- TOOLBAR -->
    <div class="toolbar">
      <div class="toolbar__nav">
        <button class="icon-btn" id="prevBtn" aria-label="Poprzedni">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <button class="today-btn" id="todayBtn">Dziś</button>
        <button class="icon-btn" id="nextBtn" aria-label="Następny">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <h2 class="toolbar__title" id="periodTitle">—</h2>
      </div>

      <div class="toolbar__right">
        <div class="view-switch" role="tablist" aria-label="Widok kalendarza">
          <button class="view-switch__btn" data-view="day" role="tab">Dzień</button>
          <button class="view-switch__btn is-active" data-view="month" role="tab">Miesiąc</button>
          <button class="view-switch__btn" data-view="year" role="tab">Rok</button>
          <span class="view-switch__pill" id="viewPill"></span>
        </div>
        <button class="add-btn" id="addBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
          <span>Dodaj</span>
        </button>
      </div>
    </div>

    <!-- CALENDAR SURFACE -->
    <main class="surface" id="surface"></main>
  </div>

  <!-- MODAL: add / edit -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal__head">
        <h3 id="modalTitle">Nowe wydarzenie</h3>
        <button class="icon-btn" data-close aria-label="Zamknij">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <form id="itemForm" class="modal__form">
        <div class="type-toggle" id="typeToggle">
          <button type="button" class="type-toggle__btn is-active" data-type="event">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg>
            Wydarzenie
          </button>
          <button type="button" class="type-toggle__btn" data-type="task">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12.5l5 5 11-12"/></svg>
            Zadanie
          </button>
        </div>

        <label class="field">
          <span>Tytuł</span>
          <input type="text" id="fTitle" placeholder="np. Spotkanie zespołu" required maxlength="80" />
        </label>

        <div class="field-row">
          <label class="field">
            <span>Data</span>
            <input type="date" id="fDate" required />
          </label>
          <label class="field field--time" id="timeField">
            <span>Godzina</span>
            <input type="time" id="fTime" />
          </label>
        </div>

        <label class="field">
          <span>Notatka <em>(opcjonalnie)</em></span>
          <textarea id="fNote" rows="2" placeholder="Szczegóły…" maxlength="240"></textarea>
        </label>

        <div class="field">
          <span>Kolor</span>
          <div class="color-picker" id="colorPicker"></div>
        </div>

        <div class="modal__actions">
          <button type="button" class="btn btn--ghost" id="deleteBtn" hidden>Usuń</button>
          <div class="spacer"></div>
          <button type="button" class="btn btn--ghost" data-close>Anuluj</button>
          <button type="submit" class="btn btn--primary" id="saveBtn">Zapisz</button>
        </div>
      </form>
    </div>
  </div>

  <!-- DAY DETAILS popover (for month/year click) is handled inline -->

  <script src="script.js"></script>
</body>
</html>
